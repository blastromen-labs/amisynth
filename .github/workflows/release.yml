name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the Amiga toolchain
        run: |
          set -euo pipefail
          curl -fsSL -o amiga-debug.vsix \
            https://github.com/BartmanAbyss/vscode-amiga-debug/releases/download/1.8.2/amiga-debug-1.8.2.vsix
          unzip -q amiga-debug.vsix "extension/bin/linux/*"
          mkdir -p toolchain
          mv extension/bin/linux/* toolchain/
          find toolchain -type f -exec chmod +x {} +
          rm -rf amiga-debug.vsix extension

      - name: Build
        run: |
          set -euo pipefail
          export PATH="$GITHUB_WORKSPACE/toolchain/opt/bin:$GITHUB_WORKSPACE/toolchain:$PATH"
          make -j"$(nproc)"
          test -f out/amisynth.exe

      - name: Choose the release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="$(gh release view --repo "${{ github.repository }}" --json tagName --jq .tagName)"
          else
            tag="${{ github.event.release.tag_name }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Attach the binary to the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: |
            out/amisynth.exe
            out/amisynth.exe.info
            out/amisynth.elf
